# V_N farm: кодирует куски видео и делает авто-нарезку. Запускается ТОЛЬКО диспетчером (workflow_dispatch).
# Секреты репозитория: FARM_URL, FARM_KEY (обязательно); YTDLP_COOKIES, YTDLP_PROXY (по желанию — для YouTube).
# Задачи: a — пробник/звук/раскадровка; 0,1,2… — куски видео; d — скачать по ссылке; t0,t1… — речь;
#         s — субтитры + нейросеть; i — вступление; p0,p1… — сборка частей.
name: farm
run-name: farm
on:
  workflow_dispatch:
    inputs:
      ticket: { description: "служебный тикет (выдаёт диспетчер)", required: true, type: string }
      tasks: { description: "служебный список задач, JSON", required: true, type: string }
permissions:
  contents: read
jobs:
  work:
    name: task ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: ffmpeg (SVT-AV1 + x264 + webp)
        run: |
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      # --- d: скачивание стрима — большой диск /mnt и yt-dlp
      - name: disk + yt-dlp
        if: matrix.task == 'd'
        run: |
          if sudo mkdir -p /mnt/farm 2>/dev/null && sudo chown "$USER" /mnt/farm; then echo "WORK_DIR=/mnt/farm" >> "$GITHUB_ENV"; fi
          df -h / /mnt 2>/dev/null || true
          python3 -m pip install -q -U "yt-dlp[default]"
      # --- t*: распознавание речи (faster-whisper + sherpa-onnx), модели кэшируются между запусками
      - name: python
        if: startsWith(matrix.task, 't')
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: ASR deps
        if: startsWith(matrix.task, 't')
        run: python -m pip install -q "faster-whisper>=1.1" "sherpa-onnx>=1.12" numpy
      - name: ASR models cache
        if: startsWith(matrix.task, 't')
        uses: actions/cache@v4
        with:
          path: ~/.cache/vn-asr
          key: vn-asr-v1
      - name: run
        env:
          FARM_URL: ${{ secrets.FARM_URL }}
          FARM_KEY: ${{ secrets.FARM_KEY }}
          YTDLP_COOKIES: ${{ matrix.task == 'd' && secrets.YTDLP_COOKIES || '' }}
          YTDLP_PROXY: ${{ matrix.task == 'd' && secrets.YTDLP_PROXY || '' }}
          TICKET: ${{ inputs.ticket }}
          TASK: ${{ matrix.task }}
        run: node farm/runner.js
